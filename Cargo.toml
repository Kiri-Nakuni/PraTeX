[package]
name = "rtex"
version = "0.1.0"
edition = "2021"
autobins = false
default-run = "pratex"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
lto = true
debug = 1

[features]
default = ["stats", "bundled-kpathsea"]

# Enables statistics
stats = []

# Linux distro builds may use an externally supplied Kpathsea 6.4.2 library.
# Other targets do not compile the dependency and keep the existing resolver boundary.
system-kpathsea = ["dep:kpathsea"]

# TUG TeX Live binary trees normally do not install a standalone libkpathsea.
# The default Linux build therefore compiles the exact pinned TL2026 library
# into PraTeX, while preserving the same run-local safe Rust adapter.
bundled-kpathsea = ["system-kpathsea", "kpathsea/build-from-source"]

# For TRIP testing
trip = ["stats"]

[dependencies]
vaak = { path = "../vaak" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

[target.'cfg(any(unix, windows))'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "linux")'.dependencies]
kpathsea = { path = "third_party/rust-kpathsea/kpathsea", optional = true, default-features = false, features = ["in-process-only-caller"] }

[[bin]]
name = "pratex"
path = "src/main.rs"

[[bin]]
name = "rtex"
path = "src/bin/rtex.rs"
